<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F — Magazine Asymmetric</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .hero-name { font-size: clamp(3rem, 8vw, 7rem); font-weight: 900; line-height: 0.88; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <section class="min-h-screen bg-[#F9FAFB] flex items-center px-10 overflow-hidden">
    <div class="max-w-6xl mx-auto relative w-full">
      <!-- Large background text -->
      <div class="absolute top-1/2 -translate-y-1/2 right-0 text-[16rem] font-black text-gray-100 leading-none select-none pointer-events-none" style="letter-spacing: -0.05em;">
        SC
      </div>
      <!-- Content -->
      <div class="relative z-10">
        <p class="text-orange-500 text-xs tracking-[0.4em] uppercase font-semibold mb-8">Product × UX × AI</p>
        <div class="flex gap-10 items-start flex-wrap lg:flex-nowrap">
          <div class="flex-1 min-w-[300px]">
            <h1 class="hero-name text-gray-900">SOM</h1>
            <h1 class="hero-name text-gray-900 mb-10">CHAKRAVARTY</h1>
            <p class="text-gray-500 text-base leading-relaxed max-w-md">
              Director-level Product Leader with 18 years across UX design, product management, and AI. Carnegie Mellon HCI '14. Currently building AI-powered infrastructure from Bangalore.
            </p>
            <div class="mt-10 flex gap-4">
              <a href="#" class="px-8 py-3.5 bg-black text-white text-sm font-semibold rounded-full">Get in Touch</a>
              <a href="#" class="px-8 py-3.5 border border-gray-300 text-gray-600 text-sm font-medium rounded-full">LinkedIn</a>
            </div>
          </div>
          <!-- Floating tilted image -->
          <div class="w-64 h-80 rounded-2xl overflow-hidden border border-gray-200 shadow-2xl rotate-3 translate-y-4 flex-shrink-0">
            <img src="/headshot.png" alt="Som" class="w-full h-full object-cover object-[center_25%]">
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
