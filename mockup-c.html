<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C — Split Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .hero-name { font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 900; line-height: 0.9; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <section class="min-h-screen bg-[#F9FAFB]">
    <div class="grid md:grid-cols-2 min-h-screen">
      <div class="bg-gray-900 relative overflow-hidden">
        <img src="/headshot.png" alt="Som" class="w-full h-full object-cover object-[center_25%] opacity-90">
        <div class="absolute inset-0 bg-gradient-to-t from-gray-900/80 to-transparent"></div>
        <div class="absolute bottom-12 left-12 text-white">
          <p class="text-xs tracking-[0.3em] uppercase text-white/60">Based in</p>
          <p class="text-xl font-semibold">Bangalore, India</p>
        </div>
      </div>
      <div class="flex flex-col justify-center p-12 lg:p-16">
        <p class="text-orange-500 text-xs tracking-[0.4em] uppercase font-semibold mb-6">Product × UX × AI</p>
        <h1 class="hero-name text-gray-900">SOM</h1>
        <h1 class="hero-name text-gray-900 mb-8">CHAKRAVARTY</h1>
        <p class="text-gray-500 text-base leading-relaxed max-w-md">
          Director-level Product Leader with 18 years across UX design, product management, and AI. Carnegie Mellon HCI '14.
        </p>
        <div class="mt-10 flex gap-4">
          <a href="#" class="px-8 py-3.5 bg-black text-white text-sm font-semibold rounded-full">Get in Touch</a>
          <a href="#" class="px-8 py-3.5 border border-gray-300 text-gray-600 text-sm font-medium rounded-full">LinkedIn</a>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
