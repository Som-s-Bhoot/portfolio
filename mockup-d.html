<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D — Dark Editorial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .hero-name { font-size: clamp(3rem, 8vw, 7rem); font-weight: 900; line-height: 0.88; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <section class="min-h-screen bg-[#0A0A0A] flex items-center px-10 lg:px-16">
    <div class="max-w-6xl mx-auto w-full">
      <div class="flex items-end gap-10 flex-wrap lg:flex-nowrap">
        <div class="flex-1">
          <p class="text-orange-400 text-xs tracking-[0.4em] uppercase font-semibold mb-6">Product × UX × AI</p>
          <h1 class="hero-name text-white">SOM</h1>
          <h1 class="hero-name text-white">CHAKRAVARTY</h1>
        </div>
        <div class="w-56 h-72 rounded-2xl overflow-hidden border border-white/10 shadow-2xl flex-shrink-0">
          <img src="/headshot.png" alt="Som" class="w-full h-full object-cover object-[center_25%]">
        </div>
      </div>
      <div class="mt-14 flex flex-wrap gap-10 lg:gap-16 border-t border-white/10 pt-10">
        <div class="flex-1 min-w-[250px]">
          <p class="text-white/40 text-[10px] tracking-[0.3em] uppercase mb-3">About</p>
          <p class="text-white/70 text-sm leading-relaxed max-w-lg">
            Director-level Product Leader with 18 years across UX design, product management, and AI. Carnegie Mellon HCI. Building from Bangalore.
          </p>
        </div>
        <div class="flex-shrink-0 flex gap-4">
          <a href="#" class="px-8 py-3.5 bg-white text-black text-sm font-semibold rounded-full">Get in Touch</a>
          <a href="#" class="px-8 py-3.5 border border-white/20 text-white text-sm font-medium rounded-full">LinkedIn</a>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
