<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E — Minimal Typography</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body>
  <section class="min-h-screen bg-white flex items-center px-10 lg:px-16">
    <div class="max-w-5xl mx-auto">
      <div class="flex items-center gap-4 mb-10">
        <div class="w-14 h-14 rounded-full overflow-hidden border border-gray-200">
          <img src="/headshot.png" alt="Som" class="w-full h-full object-cover object-[center_25%]">
        </div>
        <div class="text-gray-400 text-sm">Som Chakravarty · Bangalore</div>
      </div>
      <h1 style="font-size: clamp(2rem, 5vw, 4rem); font-weight: 300; line-height: 1.25; letter-spacing: -0.02em;" class="text-gray-900">
        Product leader with <span class="font-bold">18 years</span> building at the intersection of <span class="font-bold">design</span>, <span class="font-bold">product</span>, and <span class="font-bold">AI</span>.
      </h1>
      <div class="mt-12 flex items-center gap-8 flex-wrap">
        <a href="#" class="text-gray-900 text-sm font-semibold underline underline-offset-4 decoration-2">Get in Touch →</a>
        <a href="#" class="text-gray-500 text-sm hover:text-gray-900">LinkedIn</a>
        <span class="text-gray-300">|</span>
        <span class="text-orange-500 text-xs tracking-[0.2em] uppercase font-medium">CMU HCI '14</span>
      </div>
    </div>
  </section>
</body>
</html>
